# TaskFlow · Orquestación de contenedores
#
# Servicios:
#   - mysql          : base de datos MySQL 8 (misma definición que el stack de
#                      linkhubpruebatecnica, adaptada a la base `taskflow`)
#   - backend        : Laravel 12 sobre PHP 8.2 FPM
#   - backend-nginx  : Nginx que sirve `public/` y enruta PHP a PHP-FPM
#   - frontend       : SPA de Vue 3 compilada y servida por Nginx
#   - phpmyadmin     : interfaz web de administración de MySQL
#
# Arranque:  docker compose up -d --build
# Logs:      docker compose logs -f
# Parada:    docker compose down          (conserva los datos)
#             docker compose down -v       (elimina también los volúmenes)

services:
  mysql:
    image: mysql:8
    container_name: taskflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskflow
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: taskflow-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: TaskFlow
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8010
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: taskflow
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DRIVER: file
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      L5_SWAGGER_USE_ABSOLUTE_PATH: "false"
    volumes:
      - backend_storage:/var/www/html/storage

  backend-nginx:
    image: nginx:1.27-alpine
    container_name: taskflow-backend-nginx
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    ports:
      - "8010:80"

  frontend:
    build:
      context: ./frontend
      args:
        # La SPA llama a la API en el mismo origen: Nginx hace de proxy de
        # `/api` hacia `backend-nginx` (ver frontend/nginx.conf).
        VITE_API_BASE_URL: /api
    container_name: taskflow-frontend
    restart: unless-stopped
    depends_on:
      - backend-nginx
    ports:
      - "4300:80"

  phpmyadmin:
    image: phpmyadmin:5
    container_name: taskflow-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    ports:
      - "4301:80"

volumes:
  mysql_data:
  backend_storage:
